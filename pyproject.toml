[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind-ovos-agent-plugin"
dynamic = ["version"]
description = "OVOS agent protocol plugin for HiveMind-core"
license = { text = "Apache-2.0" }
readme = "README.md"
authors = [
    { name = "jarbasAi", email = "jarbasai@mailfence.com" }
]
requires-python = ">=3.10"
dependencies = [
    # 2.6.5a1 clears connected_event on websocket close/error, which makes
    # get_bus() health checks authoritative before Core emits client traffic.
    "ovos-bus-client>=2.8.3a1,<3.0.0",
    "ovos-config>=0.0.12,<3.0.0",
    "ovos-utils>=0.8.2,<1.0.0",
    # 1.x removes HiveMessageType.THIRDPRTY, which this plugin never used;
    # HiveMessage/HiveMessageType(.BUS/.PROPAGATE/.BROADCAST/.ESCALATE/.QUERY)
    # are unchanged, so any 1.x release works.
    "hivemind-bus-client>=1.0.0a1,<2.0.0",
    "hivemind-plugin-manager>=0.8.0a1,<1.0.0",
    "pyee>=8.1.0,<13.0.0",
]

[project.optional-dependencies]
# hivescope is deliberately NOT in `test`/`dev`: every published hivemind-core
# (up to 4.11.2a1) still caps hivemind-bus-client<1.0.0, and hivescope pulls
# hivemind-core in unconditionally. Depending on it here would make this
# package's own bus-client>=1.0.0a1 floor unresolvable (circular: lifting
# hivemind-core's cap is blocked on this package publishing a bus-client 1.x
# alpha first). tests/test_e2e_policy.py and tests/e2e/* self-skip when
# hivescope isn't importable, so dropping it here only shrinks coverage, not
# correctness. Re-add once hivemind-core publishes a >=1.0.0a1-compatible
# release; the `e2e` extra below is ready for that.
test = [
    "pytest",
    "pytest-cov",
]
# Alias so gh-automations' `pip install -e ".[dev]"` first-attempt path
# resolves; without `dev` it falls through to a buggy `pip install test`
# literal branch in the upstream workflow.
dev = [
    "pytest",
    "pytest-cov",
]
# Opt-in: exercises the hivescope-backed e2e/policy tests against a real
# hivemind-core. Only installable once hivemind-core lifts its own
# hivemind-bus-client<1.0.0 cap (see comment on `test` above).
e2e = [
    "hivescope>=0.5.2a1",
]

[project.urls]
Homepage = "https://github.com/JarbasHiveMind/hivemind-ovos-agent-plugin"
Issues = "https://github.com/JarbasHiveMind/hivemind-ovos-agent-plugin/issues"

[project.entry-points."hivemind.agent.protocol"]
"hivemind-ovos-agent-plugin" = "hivemind_ovos_agent_plugin:OVOSAgentProtocol"

[project.entry-points."hivemind.policy"]
"hivemind-ovos-agent-policy" = "hivemind_ovos_agent_plugin.policy:OVOSAgentPolicy"

[tool.setuptools.dynamic]
version = { attr = "hivemind_ovos_agent_plugin.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["hivemind_ovos_agent_plugin*"]
