name: Build Tests

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      python_versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      # install_extras intentionally unset — the upstream workflow's
      # `.[dev]` first-attempt path covers our test deps via the dev
      # extras alias. Setting it triggers a buggy `pip install test`
      # literal in gh-automations.
      test_path: 'tests'
      # TEMPORARY: hivemind-plugin-manager#27 ships the Mutation/Verdict/
      # The e2e tests exercise the policy admission chain via hivescope; pin
      # the in-flight policy branches until they release, then drop this line.
      pre_install_pip: '"hivescope @ git+https://github.com/JarbasHiveMind/hivescope@fix/acl-resolve-user" "hivemind-plugin-manager @ git+https://github.com/JarbasHiveMind/hivemind-plugin-manager@feat/policy-plugins" "hivemind-core @ git+https://github.com/JarbasHiveMind/HiveMind-core@feat/policy-chain-runner"'
